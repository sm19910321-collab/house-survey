<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家屋調査">
<meta name="theme-color" content="#1f6b66">
<title>家屋調査 作成ツール</title>
<style>
/* 設計方針：現場で手袋や片手でも押しやすい大きさ、入力と報告書の往復が少ない二画面、
   色は「白・青みのある灰緑・深い青緑」の3色だけ。文字は端末の標準の日本語フォントを使用（オフラインでも表示が崩れない） */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --ink: #1d2a2d;
  --muted: #5f6e72;
  --line: #d3dddb;
  --accent: #1f6b66;
  --accent-ink: #ffffff;
  --accent-soft: #e0efec;
  --danger: #a84f46;
  --danger-soft: #f8e8e6;
  --shadow: 0 1px 2px rgba(20, 40, 40, .05), 0 6px 16px rgba(20, 40, 40, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111819; --surface: #192224; --ink: #e3ecea; --muted: #9aaeab; --line: #2c3b3e;
    --accent: #6cc1b8; --accent-ink: #0e1a1b; --accent-soft: #203634;
    --danger: #e28a80; --danger-soft: #3a2624; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111819; --surface: #192224; --ink: #e3ecea; --muted: #9aaeab; --line: #2c3b3e;
  --accent: #6cc1b8; --accent-ink: #0e1a1b; --accent-soft: #203634;
  --danger: #e28a80; --danger-soft: #3a2624; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto 0;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- ヘッダー ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1280px; margin: 0 auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
#saveStatus { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs {
  display: none; max-width: 1280px; margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.tabs .seg { display: flex; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button {
  flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 8px;
  color: var(--muted); font-weight: 600; cursor: pointer;
}
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- ボタン ---------- */
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; text-decoration: none; white-space: nowrap; user-select: none;
}
.btn:hover { filter: brightness(1.05); }
.btn.quiet { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--line); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }

/* ---------- 二画面レイアウト ---------- */
.layout {
  max-width: 1280px; margin: 0 auto;
  padding-top: 16px; padding-bottom: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start;
}
#editor, #preview { min-width: 0; }
#preview {
  position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow: auto;
}
.preview-head { font-size: 12px; color: var(--muted); margin: 0 0 8px 2px; letter-spacing: .04em; }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tabs { display: block; }
  #preview { position: static; max-height: none; overflow: visible; }
  body[data-view="edit"] #preview { display: none; }
  body[data-view="preview"] #editor { display: none; }
}

/* ---------- カード・入力 ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card h2 {
  font-size: 15px; margin: 0 0 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--line); letter-spacing: .03em;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; min-width: 0; }
.grid2 .field { margin-top: 0; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
input, select, textarea {
  width: 100%; min-height: 44px; padding: 9px 11px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
}
select { background-color: var(--bg); }
textarea { min-height: 96px; line-height: 1.7; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
.muted { color: var(--muted); font-size: 12px; }

/* ---------- 場所 ---------- */
.room {
  border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  margin-bottom: 14px; background: var(--bg);
}
.room-head { display: flex; gap: 8px; align-items: center; }
.room-head select { flex: 1; min-width: 0; background: var(--surface); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  position: relative; display: inline-flex; align-items: center; min-height: 38px;
  padding: 0 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); font-size: 13px; cursor: pointer; user-select: none;
}
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; padding: 0; margin: 0; }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.photo-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.photo {
  margin: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; min-width: 0;
}
.photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; max-width: 100%; background: var(--line); }
.photo textarea {
  border: 0; border-top: 1px solid var(--line); border-radius: 0;
  min-height: 80px; font-size: 13px; background: var(--surface);
}
.photo .foot { padding: 6px 8px; display: flex; justify-content: flex-end; }
.empty {
  color: var(--muted); text-align: center; padding: 22px 12px; font-size: 13px;
  border: 1px dashed var(--line); border-radius: 10px;
}
.add-room { margin-top: 4px; }

/* ---------- 報告書プレビュー ---------- */
#report {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 22px; box-shadow: var(--shadow); min-height: 320px;
}
#report h1 { font-size: 19px; text-align: center; margin: 0 0 16px; letter-spacing: .08em; }
#report h3 {
  font-size: 14px; margin: 20px 0 8px; padding: 0 0 4px 8px;
  border-left: 3px solid var(--accent); letter-spacing: .02em;
}
table.info { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
table.info th, table.info td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; font-size: 13px; }
table.info th { background: var(--accent-soft); width: 20%; white-space: nowrap; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.tags span { background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.note { white-space: pre-wrap; line-height: 1.75; margin: 6px 0; }
.rep-door { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.rep-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.rep-photos figure { margin: 0; min-width: 0; }
.rep-photos img { width: 100%; border-radius: 6px; display: block; }
.rep-photos figcaption { font-size: 12px; white-space: pre-wrap; margin-top: 4px; line-height: 1.55; }
.sign { text-align: right; margin-top: 22px; font-size: 13px; color: var(--muted); }
.rep-room { margin-bottom: 8px; }

/* ---------- 通知 ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px;
  font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- 印刷（A4） ---------- */
@page { size: A4; margin: 15mm; }
@media print {
  :root {
    --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #999;
    --accent: #000; --accent-soft: #eee; --danger: #000; color-scheme: light;
  }
  body { background: #fff; color: #000; font-size: 12px; }
  body::before, .top, .tabs, #editor, .toast, .preview-head { display: none !important; }
  .layout { display: block; padding: 0; max-width: none; }
  #preview { display: block !important; position: static; max-height: none; overflow: visible; }
  #report { box-shadow: none; border: 0; padding: 0; min-height: 0; }
  /* 1ページに場所を2つずつ入れる */
  .rep-room { break-inside: avoid; margin-bottom: 4mm; }
  .rep-room:nth-child(2n) { break-after: page; }
  .rep-room:last-child { break-after: auto; }
  .rep-room h3 { margin: 0 0 2mm; font-size: 12px; }
  .rep-room .tags { margin: 0 0 2mm; }
  .rep-room .tags span { font-size: 10px; padding: 1px 7px; }
  .rep-room .note { font-size: 11px; line-height: 1.5; margin: 2mm 0; }
  .rep-room .rep-door { font-size: 11px; margin: 0 0 1mm; }
  .rep-photos { grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 2mm; }
  .rep-photos img { width: 100%; height: auto; max-height: 60mm; object-fit: contain; }
  .rep-photos figcaption { font-size: 10px; margin-top: 1mm; }
  table.info th { background: #eee; }
}
</style>
</head>
<body data-view="edit">

<header class="top">
  <div class="bar">
    <div class="brand">
      <h1>家屋調査 作成ツール</h1>
      <span id="saveStatus"></span>
    </div>
    <div class="actions">
      <button class="btn quiet small" id="btnSave" type="button">データを保存</button>
      <label class="btn quiet small">データを読込<input type="file" id="fileLoad" accept=".json,application/json" hidden></label>
      <button class="btn quiet small" id="btnCopy" type="button">テキストをコピー</button>
      <button class="btn small" id="btnPrint" type="button">印刷 / PDF</button>
      <button class="btn danger small" id="btnClear" type="button">全消去</button>
    </div>
  </div>
  <nav class="tabs">
    <div class="seg" role="group" aria-label="表示切り替え">
      <button type="button" data-view-btn="edit" aria-pressed="true">入力</button>
      <button type="button" data-view-btn="preview" aria-pressed="false">報告書プレビュー</button>
    </div>
  </nav>
</header>

<main class="layout">
  <div id="editor">
    <section class="card">
      <h2>基本情報</h2>
      <div class="grid2">
        <div class="field"><label class="field-label" for="i-name">利用者名</label><input id="i-name" data-info="name"></div>
        <div class="field"><label class="field-label" for="i-date">調査日</label><input id="i-date" type="date" data-info="date"></div>
        <div class="field"><label class="field-label" for="i-staff">担当者</label><input id="i-staff" data-info="staff"></div>
        <div class="field"><label class="field-label" for="i-type">住宅形態</label>
          <select id="i-type" data-info="houseType">
            <option value="">選択してください</option>
            <option>戸建て</option>
            <option>集合住宅（マンション・アパート）</option>
            <option>その他</option>
          </select>
        </div>
      </div>
      <div class="field"><label class="field-label" for="i-address">住所</label><input id="i-address" data-info="address"></div>
      <div class="field"><label class="field-label" for="i-purpose">調査目的・依頼内容</label><textarea id="i-purpose" data-info="purpose"></textarea></div>
    </section>

    <section class="card">
      <h2>場所ごとの所見・写真</h2>
      <div id="rooms"></div>
      <button class="btn ghost add-room" id="btnAddRoom" type="button">＋ 場所を追加</button>
      <p class="hint">場所を選ぶと、その場所に合ったチェック項目に切り替わります。詳細は自由記述に書けます。写真は場所ごとに追加し、説明も書き込めます。</p>
    </section>

    <section class="card">
      <h2>まとめ</h2>
      <div id="wrapFields"></div>
      <div class="field"><label class="field-label" for="summary">総合所見</label>
        <textarea id="summary" placeholder="家屋全体の状態、生活動作上の主な課題など"></textarea>
      </div>
    </section>
  </div>

  <aside id="preview">
    <div class="preview-head">報告書プレビュー（印刷時はこの部分だけが出力されます）</div>
    <div id="report"></div>
  </aside>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'houseSurvey.v1'; // 旧バージョンの保存データもそのまま読めます

// 場所の種類ごとのチェック項目
const CHECKS_BY_TYPE = {
  '門扉・アプローチ': ['門扉の開閉困難','アプローチの傾斜','砂利・不陸（凹凸）','雨天時に滑りやすい','段差あり','手すり必要'],
  '玄関前': ['段差あり','手すり必要','手すり設置済','雨天時に滑りやすい','アプローチの傾斜'],
  '玄関': ['玄関の段差','段差あり','手すり必要','手すり設置済','滑りやすい床','照明不足','扉・通路幅不足'],
  '廊下': ['段差あり','手すり必要','手すり設置済','滑りやすい床','照明不足','扉・通路幅不足'],
  '階段': ['段差あり','手すり必要','手すり設置済','滑りやすい床','照明不足'],
  '居室': ['段差あり','手すり必要','滑りやすい床','照明不足','扉・通路幅不足'],
  '寝室': ['段差あり','手すり必要','照明不足','寝室からの動線','扉・通路幅不足'],
  'トイレ': ['段差あり','手すり必要','手すり設置済','トイレ動線','扉・通路幅不足'],
  '浴室・脱衣所': ['浴槽またぎ困難','段差あり','手すり必要','手すり設置済','滑りやすい床'],
  '洗面所': ['段差あり','手すり必要','滑りやすい床','照明不足'],
  '台所': ['段差あり','手すり必要','滑りやすい床','照明不足'],
  'ダイニング': ['段差あり','滑りやすい床','扉・通路幅不足'],
  'ベランダ・外部': ['段差あり','手すり必要','滑りやすい床','雨天時に滑りやすい'],
  'その他': ['段差あり','手すり必要','滑りやすい床','照明不足','扉・通路幅不足']
};
const ROOM_TYPES = Object.keys(CHECKS_BY_TYPE);
const COMMON_CHECKS = ['その他'];
const checksFor = type => [...(CHECKS_BY_TYPE[type] || []), ...COMMON_CHECKS];

// 扉の種類を選ぶ場所（玄関・トイレ・浴室・寝室のみ）
const DOOR_ROOMS = ['玄関', 'トイレ', '浴室・脱衣所', '寝室'];
const DOOR_TYPES = ['', '引き戸', '開き戸（内開き）', '開き戸（外開き）', '折れ戸', '引き違い戸', 'アコーディオンドア', 'ドアなし（間仕切り）', '自動ドア', 'その他'];

// まとめの項目
const WRAP_FIELDS = [
  ['requests', '本人・家族の希望'],
  ['problems', '主な問題点（生活動作・安全面）'],
  ['remodel', '住宅改修の提案（場所・内容・優先度）'],
  ['equipment', '福祉用具の提案'],
  ['next', '次回確認事項・残課題'],
  ['others', 'その他・申し送り']
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

function blankState() {
  return { info: { name: '', date: todayStr(), staff: '', address: '', houseType: '', purpose: '' }, rooms: [], summary: '', wrap: {} };
}
// 読み込んだデータの形を整える（欠けている項目があっても壊れないように）
function normalize(d) {
  const s = blankState();
  if (!d || typeof d !== 'object') return s;
  Object.assign(s.info, d.info || {});
  s.rooms = Array.isArray(d.rooms) ? d.rooms.map(r => ({
    type: r.type || '居室',
    door: r.door || '',
    checks: Array.isArray(r.checks) ? r.checks : [],
    note: r.note || '',
    photos: Array.isArray(r.photos) ? r.photos : []
  })) : [];
  s.summary = d.summary || '';
  s.wrap = d.wrap && typeof d.wrap === 'object' ? d.wrap : {};
  return s;
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }

let state = normalize(load());
let timer = null;

function setStatus(text) { $('saveStatus').textContent = text; }
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    setStatus('自動保存 ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    setStatus('保存容量がいっぱいです');
    toast('保存容量がいっぱいです。「データを保存」でファイルに残してください');
  }
}
// 入力中は少し待ってから保存・プレビューを更新（写真が多くても動きが重くならないように）
function scheduleCommit() { clearTimeout(timer); timer = setTimeout(() => { save(); renderPreview(); }, 300); }
function commit(full) { clearTimeout(timer); save(); if (full) renderEditor(); renderPreview(); }

// 二段階の操作（1回目で「もう一度押すと削除」、3秒以内の2回目で実行）
// 確認ダイアログを使わないので、どの閲覧環境でも動きます
function armed(btn, run) {
  if (btn.dataset.armed) { clearTimeout(btn._t); run(); return; }
  const label = btn.textContent;
  btn.dataset.armed = '1';
  btn.classList.add('armed');
  btn.textContent = 'もう一度押すと削除';
  btn._t = setTimeout(() => { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = label; }, 3000);
}

// 写真を縮小して取り込む（保存容量と表示の速さのため）
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('読み込めません')); };
    img.src = url;
  });
}

function renderBasic() {
  document.querySelectorAll('[data-info]').forEach(el => { el.value = state.info[el.dataset.info] || ''; });
  $('summary').value = state.summary || '';
}
function renderWrap() {
  $('wrapFields').innerHTML = WRAP_FIELDS.map(([k, l]) => `
    <div class="field">
      <label class="field-label" for="wrap-${k}">${esc(l)}</label>
      <textarea id="wrap-${k}" data-wrap="${k}">${esc(state.wrap[k] || '')}</textarea>
    </div>`).join('');
}

function roomHTML(r, idx) {
  const checks = checksFor(r.type);
  return `
  <article class="room">
    <div class="room-head">
      <select data-room="${idx}" data-k="type" aria-label="場所の種類">
        ${ROOM_TYPES.map(t => `<option ${t === r.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select>
      <button class="btn danger small" type="button" data-act="delroom" data-room="${idx}">削除</button>
    </div>
    ${DOOR_ROOMS.includes(r.type) ? `
    <div class="field">
      <span class="field-label">扉の種類</span>
      <select data-room="${idx}" data-k="door">
        ${DOOR_TYPES.map(d => `<option value="${esc(d)}" ${d === (r.door || '') ? 'selected' : ''}>${d || '未選択'}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="field">
      <span class="field-label">チェック</span>
      <div class="chips">
        ${checks.map(c => `<label class="chip"><input type="checkbox" data-check="${esc(c)}" data-room="${idx}" ${r.checks.includes(c) ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="note-${idx}">詳細な所見（状態・動作の様子・環境・改善提案）</label>
      <textarea id="note-${idx}" data-room="${idx}" data-k="note" placeholder="例：洗面所前の段差は約3cm。立位時に手すりなしではふらつきあり。">${esc(r.note)}</textarea>
    </div>
    <div class="photo-bar">
      <label class="btn ghost small">＋ 写真を追加<input type="file" accept="image/*" multiple hidden data-act="photo" data-room="${idx}"></label>
      <span class="muted">${r.photos.length} 枚</span>
    </div>
    ${r.photos.length ? `<div class="photos">
      ${r.photos.map((p, pi) => `
        <figure class="photo">
          <img src="${p.src}" alt="${idx + 1}-${pi + 1} の写真">
          <textarea data-room="${idx}" data-pi="${pi}" data-caption="1" placeholder="写真の説明（寸法・状態・改修箇所など）" aria-label="写真の説明">${esc(p.caption)}</textarea>
          <div class="foot"><button class="btn danger small" type="button" data-act="delphoto" data-room="${idx}" data-pi="${pi}">写真を削除</button></div>
        </figure>`).join('')}
    </div>` : ''}
  </article>`;
}

function renderEditor() {
  $('rooms').innerHTML = state.rooms.length
    ? state.rooms.map(roomHTML).join('')
    : '<div class="empty">「＋ 場所を追加」から、玄関や居室などを追加してください。</div>';
}

function renderPreview() {
  const i = state.info;
  let roomsHTML = state.rooms.map((r, idx) => `
    <div class="rep-room">
      <h3>${idx + 1}. ${esc(r.type)}</h3>
      ${r.door ? `<p class="rep-door">扉：${esc(r.door)}</p>` : ''}
      ${r.checks.length ? `<div class="tags">${r.checks.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}
      ${r.note ? `<div class="note">${nl(r.note)}</div>` : ''}
      ${r.photos.length ? `<div class="rep-photos">${r.photos.map((p, pi) => `
        <figure><img src="${p.src}" alt=""><figcaption>写真${idx + 1}-${pi + 1}：${nl(p.caption)}</figcaption></figure>`).join('')}
      </div>` : ''}
    </div>`).join('');

  const wrapHTML = WRAP_FIELDS.filter(([k]) => state.wrap[k])
    .map(([k, l]) => `<h3>${esc(l)}</h3><div class="note">${nl(state.wrap[k])}</div>`).join('');

  $('report').innerHTML = `
    <h1>家屋調査報告書</h1>
    <table class="info">
      <tr><th>利用者名</th><td>${esc(i.name)}</td><th>調査日</th><td>${esc(i.date)}</td></tr>
      <tr><th>住所</th><td colspan="3">${esc(i.address)}</td></tr>
      <tr><th>住宅形態</th><td>${esc(i.houseType)}</td><th>担当者</th><td>${esc(i.staff)}</td></tr>
      <tr><th>調査目的</th><td colspan="3">${nl(i.purpose)}</td></tr>
    </table>
    <div class="rep-rooms">${roomsHTML}</div>
    ${wrapHTML}
    ${state.summary ? `<h3>総合所見</h3><div class="note">${nl(state.summary)}</div>` : ''}
    <p class="sign">作成日：${esc(i.date)}　担当：${esc(i.staff)}</p>`;
}

function setView(view) {
  document.body.dataset.view = view;
  document.querySelectorAll('[data-view-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.viewBtn === view)));
}

// 入力欄（文字）の反映
$('editor').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.info) state.info[t.dataset.info] = t.value;
  else if (t.id === 'summary') state.summary = t.value;
  else if (t.dataset.wrap) state.wrap[t.dataset.wrap] = t.value;
  else if (t.dataset.caption !== undefined) state.rooms[+t.dataset.room].photos[+t.dataset.pi].caption = t.value;
  else if (t.dataset.k === 'note') state.rooms[+t.dataset.room].note = t.value;
  else return;
  scheduleCommit();
});

// 選択・チェック・写真の追加
$('editor').addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.act === 'photo') {
    const r = state.rooms[+t.dataset.room];
    const files = [...t.files];
    t.value = '';
    if (!files.length) return;
    toast(`写真を${files.length}枚取り込んでいます…`);
    let failed = 0;
    for (const f of files) {
      try { r.photos.push({ src: await compress(f), caption: '' }); }
      catch (err) { failed++; }
    }
    commit(true);
    toast(failed ? `${failed}枚は読み込めませんでした（HEIC形式は一度JPEGに変換してください）` : '写真を取り込みました');
    return;
  }
  if (t.dataset.check !== undefined) {
    const r = state.rooms[+t.dataset.room];
    const c = t.dataset.check;
    r.checks = t.checked ? [...new Set([...r.checks, c])] : r.checks.filter(x => x !== c);
    commit(false);
    return;
  }
  if (t.dataset.k === 'type') {
    const r = state.rooms[+t.dataset.room];
    r.type = t.value;
    // 新しい場所に合わないチェックは外す。扉の種類は扉のない場所では消す
    const allowed = checksFor(r.type);
    r.checks = r.checks.filter(c => allowed.includes(c));
    if (!DOOR_ROOMS.includes(r.type)) r.door = '';
    commit(true);
    return;
  }
  if (t.dataset.k === 'door') {
    state.rooms[+t.dataset.room].door = t.value;
    commit(false);
  }
});

// 削除・場所の追加
$('editor').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'delroom') {
    armed(b, () => { state.rooms.splice(+b.dataset.room, 1); commit(true); });
  } else if (b && b.dataset.act === 'delphoto') {
    armed(b, () => { state.rooms[+b.dataset.room].photos.splice(+b.dataset.pi, 1); commit(true); });
  }
});

$('btnAddRoom').addEventListener('click', () => {
  state.rooms.push({ type: '居室', door: '', checks: [], note: '', photos: [] });
  commit(true);
  const rooms = document.querySelectorAll('.room');
  if (rooms.length) rooms[rooms.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// 基本情報の入力欄は、入力欄の変更とは別に保存する（日付・住宅形態の選択用）
document.querySelectorAll('[data-info]').forEach(el => el.addEventListener('change', () => { state.info[el.dataset.info] = el.value; commit(false); }));

// 表示切り替え（狭い画面）
document.querySelectorAll('[data-view-btn]').forEach(b => b.addEventListener('click', () => setView(b.dataset.viewBtn)));

// データの保存（ファイルとしてダウンロード・写真も含みます）
$('btnSave').addEventListener('click', async () => {
  const name = (state.info.name || '利用者未入力').replace(/[\\/:*?"<>|\s]/g, '');
  const fname = `家屋調査_${name}_${state.info.date || todayStr()}.json`;
  const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
  // iPhone・iPadでは共有メニューから「ファイルに保存」できるようにする
  try {
    const file = new File([blob], fname, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: fname });
      toast('共有メニューで「ファイルに保存」を選んでください');
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return; // 共有を途中でやめた場合
  }
  // それ以外はダウンロードとして保存
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('ダウンロードを開始しました（Safariのダウンロード欄で確認できます）');
  } catch (err) {
    toast('この画面では保存できません。ファイルを開き直してから保存してください');
  }
});

// データの読込（保存したファイルを開き直す）
$('fileLoad').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !data.info || !Array.isArray(data.rooms)) throw new Error('format');
    state = normalize(data);
    renderBasic();
    renderWrap();
    commit(true);
    toast('データを読み込みました（前の入力内容は置き換わりました）');
  } catch (err) {
    toast('読み込めませんでした。家屋調査ツールで保存したファイルを選んでください');
  }
});

// テキストのコピー（記録欄へ貼り付け用）
function plainText() {
  const i = state.info;
  let t = `【家屋調査】${i.date}\n利用者名：${i.name}\n住所：${i.address}\n住宅形態：${i.houseType}\n担当者：${i.staff}\n調査目的：${i.purpose}\n\n`;
  state.rooms.forEach((r, idx) => {
    t += `■${idx + 1} ${r.type}\n`;
    if (r.door) t += `扉：${r.door}\n`;
    if (r.checks.length) t += `チェック：${r.checks.join('、')}\n`;
    if (r.note) t += `${r.note}\n`;
    r.photos.forEach((p, pi) => { if (p.caption) t += `（写真${idx + 1}-${pi + 1}）${p.caption}\n`; });
    t += '\n';
  });
  WRAP_FIELDS.forEach(([k, l]) => { if (state.wrap[k]) t += `【${l}】\n${state.wrap[k]}\n\n`; });
  if (state.summary) t += `【総合所見】\n${state.summary}\n`;
  return t;
}
$('btnCopy').addEventListener('click', async () => {
  const text = plainText();
  try {
    await navigator.clipboard.writeText(text);
    toast('テキストをコピーしました');
  } catch (err) {
    // クリップボードが使えない環境では、テキストを選択状態にして手動コピーに備える
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? 'テキストをコピーしました' : 'コピーできませんでした。ファイル保存をご利用ください');
  }
});

$('btnPrint').addEventListener('click', () => {
  try { window.print(); } catch (e) { toast('この環境では印刷できません'); }
});

$('btnClear').addEventListener('click', () => {
  armed($('btnClear'), () => {
    state = blankState();
    renderBasic();
    renderWrap();
    commit(true);
    toast('入力内容を消去しました');
  });
});

// 入力中に画面を離れても保存されるように
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(timer); save(); } });

// 初期表示
renderBasic();
renderWrap();
renderEditor();
renderPreview();
save();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
